<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360">
  <title>Yurrr</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app" data-boot-state="booting">
    <div class="header">
      <div class="brand">
        <span class="logo-mark" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M14 8a4 4 0 1 1 0 8H7a3 3 0 0 1 0-6h7" />
            <path d="m14 12 7 0" />
            <path d="m18 9 0 6" />
          </svg>
        </span>
        <span class="logo">Yurrr</span>
      </div>
      <div class="header-actions">
        <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3.5v3" />
            <path d="M12 17.5v3" />
            <path d="m4.8 7 2.1 2.1" />
            <path d="m17.1 14.9 2.1 2.1" />
            <path d="M3.5 12h3" />
            <path d="M17.5 12h3" />
            <path d="m4.8 17 2.1-2.1" />
            <path d="m17.1 9.1 2.1-2.1" />
            <circle cx="12" cy="12" r="4" />
          </svg>
        </button>
        <button id="lock-btn" class="icon-btn hidden" title="Lock Vault" aria-label="Lock Vault">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 7.5V6a3 3 0 1 1 6 0v1.5" />
            <rect x="5" y="7.5" width="14" height="11.5" rx="2" />
            <path d="M12 11.5v3" />
          </svg>
        </button>
      </div>
    </div>

    <div id="boot-screen" class="screen boot-screen" data-screen="boot" role="status" aria-live="polite" aria-label="Loading Yurrr">
      <div class="boot-card">
        <div class="boot-mark" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8.5 10V7.5a3.5 3.5 0 1 1 7 0V10" />
            <rect x="5" y="10" width="14" height="10" rx="2" />
            <path d="M12 14v2.5" />
          </svg>
        </div>
        <div>
          <div class="boot-title">Opening vault</div>
          <div class="boot-copy">Checking session and server status...</div>
        </div>
      </div>
      <div class="skeleton-stack" aria-hidden="true">
        <div class="skeleton-line skeleton-line-wide"></div>
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
      </div>
    </div>

    <div id="login-screen" class="screen hidden" data-screen="login">
      <div class="login-status" id="login-status" role="status" aria-live="polite">
        <span class="status-dot" id="server-status" aria-hidden="true"></span>
        <span id="server-status-text">Checking server...</span>
      </div>
      <div class="login-form">
        <label class="sr-only" for="master-password">Master password</label>
        <input type="password" id="master-password" placeholder="Master password" autocomplete="current-password" autofocus aria-describedby="server-status-text login-error">
        <button id="unlock-btn" class="btn btn-primary btn-full" type="button">
          <span class="btn-content">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M8.5 10V7.5a3.5 3.5 0 1 1 7 0V10" />
              <rect x="5" y="10" width="14" height="10" rx="2" />
              <path d="M12 14v2.5" />
            </svg>
            <span class="btn-label">Unlock</span>
          </span>
        </button>
      </div>
      <div id="login-error" class="error hidden" role="alert"></div>
      <div id="setup-section" class="hidden">
        <p class="hint">No vault found. Create one:</p>
        <button id="setup-btn" class="btn btn-secondary btn-full" type="button">
          <span class="btn-content">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M14 8a4 4 0 1 1 0 8H7a3 3 0 0 1 0-6h7" />
              <path d="m14 12 7 0" />
              <path d="m18 9 0 6" />
            </svg>
            <span class="btn-label">Initialize Vault</span>
          </span>
        </button>
      </div>
    </div>

    <div id="list-screen" class="screen hidden" data-screen="list">
      <div class="vault-sections" role="tablist" aria-label="Vault sections">
        <button id="section-passwords" class="section-chip section-chip-active" type="button" role="tab" aria-selected="true" aria-controls="entry-list">Passwords</button>
        <button id="section-passkeys" class="section-chip" type="button" role="tab" aria-selected="false" aria-controls="entry-list">Passkeys</button>
        <button id="section-cards" class="section-chip" type="button" role="tab" aria-selected="false" aria-controls="entry-list">Cards</button>
        <button id="section-addresses" class="section-chip" type="button" role="tab" aria-selected="false" aria-controls="entry-list">Addresses</button>
      </div>
      <div class="search-bar">
        <label class="sr-only" for="search-input">Search vault items</label>
        <span class="search-icon" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" />
            <path d="m16 16 4 4" />
          </svg>
        </span>
        <input type="text" id="search-input" placeholder="Search passwords..." autocomplete="off">
      </div>
      <div id="entry-list" class="entry-list" role="tabpanel" aria-labelledby="section-passwords" aria-live="polite"></div>
      <button id="add-btn" class="fab" title="Add" aria-label="Add" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 5v14" />
          <path d="M5 12h14" />
        </svg>
      </button>
    </div>

    <div id="detail-screen" class="screen hidden" data-screen="detail">
      <div class="detail-header">
        <button id="back-from-detail" class="icon-btn" title="Back" aria-label="Back" type="button">
          <svg class="icon icon-rotate-left" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m9 6 6 6-6 6" />
          </svg>
        </button>
        <div id="detail-favicon" class="detail-favicon"></div>
        <span id="detail-domain" class="detail-title"></span>
        <div class="detail-actions">
          <button id="edit-entry-btn" class="icon-btn" title="Edit" aria-label="Edit entry" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M14 8a4 4 0 1 1 0 8H7a3 3 0 0 1 0-6h7" />
              <path d="m14 12 7 0" />
              <path d="m18 9 0 6" />
            </svg>
          </button>
          <button id="delete-entry-btn" class="icon-btn danger" title="Delete" aria-label="Delete entry" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 7h16" />
              <path d="M10 11v6" />
              <path d="M14 11v6" />
              <path d="M7 7l1 12h8l1-12" />
              <path d="M9 7V5h6v2" />
            </svg>
          </button>
        </div>
      </div>
      <div class="detail-body">
        <div class="detail-field">
          <label>Website</label>
          <div class="detail-value">
            <span id="detail-url"></span>
            <button class="copy-btn" data-copy="detail-url" title="Open" aria-label="Open website" type="button">
              <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M10 14 20 4" />
                <path d="M14 4h6v6" />
                <path d="M20 14v4a2 2 0 0 1-2 2h-4" />
                <path d="M10 20H6a2 2 0 0 1-2-2v-4" />
                <path d="M4 10V6a2 2 0 0 1 2-2h4" />
              </svg>
            </button>
          </div>
        </div>
        <div class="detail-field">
          <label>Username</label>
          <div class="detail-value">
            <span id="detail-username"></span>
            <button class="copy-btn" data-copy="detail-username" title="Copy" aria-label="Copy username" type="button">
              <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="9" y="9" width="11" height="11" rx="2" />
                <path d="M5 15V6a2 2 0 0 1 2-2h9" />
              </svg>
            </button>
          </div>
        </div>
        <div class="detail-field">
          <label>Password</label>
          <div class="detail-value">
            <span id="detail-password" class="password-masked"></span>
            <button id="toggle-password" class="copy-btn" title="Show" aria-label="Show password" type="button">
              <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
            <button class="copy-btn" data-copy="detail-password" title="Copy" aria-label="Copy password" type="button">
              <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="9" y="9" width="11" height="11" rx="2" />
                <path d="M5 15V6a2 2 0 0 1 2-2h9" />
              </svg>
            </button>
          </div>
        </div>
        <div class="detail-field" id="detail-notes-field">
          <label>Notes</label>
          <div class="detail-value">
            <span id="detail-notes"></span>
          </div>
        </div>
      </div>
    </div>

    <div id="form-screen" class="screen hidden" data-screen="form">
      <div class="detail-header">
        <button id="back-from-form" class="icon-btn" title="Back" aria-label="Back" type="button">
          <svg class="icon icon-rotate-left" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m9 6 6 6-6 6" />
          </svg>
        </button>
        <span id="form-title" class="detail-title">Add Entry</span>
      </div>
      <div class="form-body">
        <div class="field">
          <label for="form-url">Website URL</label>
          <input type="text" id="form-url" placeholder="https://example.com" autocomplete="url">
        </div>
        <div class="field">
          <label for="form-username">Username / Email</label>
          <input type="text" id="form-username" placeholder="user@example.com" autocomplete="username">
        </div>
        <div class="field">
          <label for="form-password">Password</label>
          <div class="password-row">
            <input type="password" id="form-password" placeholder="Password" autocomplete="new-password" aria-describedby="strength-text">
            <button id="form-toggle-pw" class="icon-btn" title="Show" aria-label="Show password" type="button">
              <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
            <button id="form-generate" class="icon-btn" title="Generate" aria-label="Generate password" type="button">
              <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M14 8a4 4 0 1 1 0 8H7a3 3 0 0 1 0-6h7" />
                <path d="m14 12 7 0" />
                <path d="m18 9 0 6" />
              </svg>
            </button>
          </div>
          <div id="strength-bar" class="strength-bar" role="meter" aria-labelledby="strength-text" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0">
            <div id="strength-fill" class="strength-fill"></div>
          </div>
          <div id="strength-text" class="strength-text" aria-live="polite">Password strength: empty</div>
        </div>
        <div class="field">
          <label for="form-notes">Notes (optional)</label>
          <textarea id="form-notes" rows="3" placeholder="Additional notes..."></textarea>
        </div>
        <div class="form-actions">
          <button id="form-cancel" class="btn btn-secondary" type="button">
            <span class="btn-content">
              <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m6 6 12 12" />
                <path d="m18 6-12 12" />
              </svg>
              <span class="btn-label">Cancel</span>
            </span>
          </button>
          <button id="form-save" class="btn btn-primary" type="button">
            <span class="btn-content">
              <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m5 12 4 4 10-10" />
              </svg>
              <span class="btn-label">Save</span>
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="components/login.js"></script>
  <script src="components/entry-list.js"></script>
  <script src="components/entry-detail.js"></script>
  <script src="components/entry-form.js"></script>
  <script src="components/password-generator.js"></script>
  <script src="popup.js"></script>
</body>
</html>
